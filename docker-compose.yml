name: coworking

services:
  catalog-service:
    build: ./catalog-service
    container_name: catalog-service
    ports:
      - "8001:8001"
    networks:
      - coworking-network

  orders-service:
    build: ./orders-service
    container_name: orders-service
    ports:
      - "8002:8002"
    environment:
      - CATALOG_URL=http://catalog-service:8001
    depends_on:
      - catalog-service
    networks:
      - coworking-network

networks:
  coworking-network:
    driver: bridge